<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Laser Attack - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #0ff;
            /* Cyan text */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 10px;
            box-sizing: border-box;
        }

        #scoreboard {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            width: 95vw;
            max-width: 800px;
            padding: 10px 0;
            font-size: clamp(10px, 2.5vw, 14px);
            color: #fff;
        }

        #scoreboard span {
            padding: 5px 10px;
            background-color: #222;
            border: 1px solid #0f0;
            border-radius: 5px;
            flex-grow: 1;
            text-align: center;
        }

        #game-container {
            border: 3px solid #0f0;
            /* Green border */
            background-color: #111;
            position: relative;
            box-shadow: 0 0 20px #0f0;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            font-size: clamp(14px, 3.5vw, 20px);
            display: none;
            box-shadow: 0 0 15px #0f0;
            width: 85%;
            max-width: 550px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #message-box button {
            font-family: 'Press Start 2P', cursive;
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: clamp(10px, 3vw, 15px);
            transition: background-color 0.3s, color 0.3s;
        }

        #message-box button:hover {
            background-color: #fff;
            color: #0f0;
        }

        @media (max-width: 600px) {
            #scoreboard {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            #scoreboard span {
                width: 80%;
            }

            #game-container {
                height: auto;
                min-height: 250px;
            }
        }
    </style>
</head>

<body>
    <div id="scoreboard">
        <span id="level-display">Level: 1</span>
        <span id="score-display">Score: 0</span>
        <span id="highscore-display">HI-SCORE: 0</span>
        <span id="lives-display">Lives: 3</span>
        <span id="wpm-display">WPM: 5</span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="message-box">
        <p id="message-text"></p>
        <div class="button-group">
            <button id="message-button">Campaign</button>
            <button id="message-button-endless">Endless Mode</button>
        </div>
    </div>

    <script>
        // --- Game Configuration ---
        const MAX_LEVELS = 50;
        const WORDS_PER_LEVEL = 5;
        const INITIAL_LIVES = 3;
        const BASE_WPM = 5;
        const WPM_INCREMENT_PER_LEVEL = 2;
        const WORD_LENGTH_MIN = 2;
        const WORD_LENGTH_MAX = 6;
        const CANNON_HEIGHT = 20;

        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('level-display');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const livesDisplay = document.getElementById('lives-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const messageButton = document.getElementById('message-button');
        const messageButtonEndless = document.getElementById('message-button-endless');

        // --- Word List ---
        const allWordsList = ["cat", "dog", "sun", "run", "big", "fun", "sky", "fly", "try", "eat", "tea", "pen", "cup", "map", "hat", "top", "joy", "gem", "elf", "ink", "ace", "act", "add", "age", "ago", "aid", "aim", "air", "ale", "all", "and", "ant", "any", "ape", "apt", "arc", "are", "ark", "arm", "art", "ash", "ask", "auk", "awe", "axe", "aye", "bad", "bag", "ban", "bar", "bat", "bay", "bed", "bee", "beg", "bet", "bib", "bid", "bin", "bio", "bit", "boa", "bob", "bog", "boo", "bop", "bow", "box", "boy", "bra", "bud", "bug", "bum", "bun", "bur", "bus", "but", "buy", "bye", "cab", "cad", "cam", "can", "cap", "car", "caw", "cay", "chi", "cod", "cog", "con", "coo", "cop", "cot", "cow", "cox", "coy", "cry", "cub", "cud", "cue", "cur", "cut", "dab", "dad", "dam", "dan", "dap", "day", "den", "dew", "did", "die", "dig", "dim", "din", "dip", "doc", "doe", "don", "dot", "dry", "dub", "dud", "due", "dug", "dun", "duo", "dye", "ear", "eel", "egg", "ego", "eke", "elk", "elm", "emu", "end", "eon", "era", "erg", "err", "eve", "eye", "fad", "fag", "fan", "far", "fat", "fax", "fay", "fed", "fee", "fen", "few", "fig", "fin", "fir", "fit", "fix", "flu", "fob", "foe", "fog", "fop", "for", "fox", "fry", "gag", "gal", "gap", "gas", "gay", "gee", "gel", "get", "gig", "gin", "god", "goo", "got", "gum", "gun", "gut", "guy", "gym", "had", "hag", "ham", "has", "hay", "hem", "hen", "her", "hex", "hey", "hid", "him", "hip", "his", "hit", "hoe", "hog", "hop", "hot", "how", "hub", "hue", "hug", "hum", "hun", "hut", "ice", "icy", "igg", "ill", "imp", "inn", "ion", "ire", "irk", "its", "ivy", "jab", "jag", "jam", "jar", "jaw", "jay", "jet", "jew", "jib", "jig", "job", "jog", "jot", "jug", "jun", "jus", "jut", "keg", "ken", "key", "kid", "kin", "kip", "kit", "lab", "lac", "lad", "lag", "lam", "lap", "lax", "lay", "lea", "led", "lee", "leg", "let", "lid", "lie", "lip", "lit", "lob", "log", "lop", "lot", "low", "lux", "lye", "mad", "mag", "man", "mar", "maw", "may", "men", "met", "mew", "mid", "mil", "mix", "mob", "mod", "mol", "mom", "mon", "mop", "mot", "mud", "mug", "mum", "nab", "nag", "nap", "nay", "net", "new", "nib", "nil", "nip", "nit", "nix", "nob", "nod", "nog", "nor", "nos", "not", "now", "nub", "nun", "nut", "oaf", "oak", "oar", "oat", "odd", "ode", "off", "oft", "ohm", "oil", "old", "one", "opt", "orb", "ore", "our", "out", "ova", "owe", "owl", "own", "pad", "pal", "pap", "par", "pat", "paw", "pay", "pea", "peg", "pep", "per", "pet", "pew", "phi", "pie", "pig", "pip", "pit", "ply", "pod", "poi", "pol", "pop", "pot", "pox", "pro", "pry", "pub", "pug", "pun", "pup", "pus", "put", "rad", "radial", "raffle", "random", "ranger", "rarely", "rather", "rating", "reader", "really", "reaper", "reason", "recall", "recent", "recipe", "reckon", "record", "recur", "redeem", "reduce", "refine", "reflex", "reform", "refuge", "refuse", "regain", "regard", "regime", "region", "regret", "reject", "relate", "relief", "relish", "remain", "remark", "remedy", "remind", "remote", "remove", "render", "rental", "repair", "repeal", "repeat", "repel", "report", "rescue", "resent", "reside", "resign", "resist", "resort", "result", "resume", "retail", "retain", "retire", "return", "reveal", "revere", "review", "revise", "revive", "reward", "rhythm", "ribbon", "richer", "robust", "rocket", "rodent", "roller", "roster", "rotate", "rubber", "rubble", "rudder", "rugby", "ruin", "runner", "rustic", "sacred", "saddle", "safari", "safely", "sailor", "salary", "saline", "salmon", "saloon", "salute", "sample", "sandal", "sarcasm", "satire", "savage", "saving", "scalar", "scalp", "scam", "scarce", "scatter", "scenic", "scheme", "school", "scold", "scream", "screen", "script", "scroll", "sculpt", "sealed", "search", "season", "second", "secret", "sector", "secure", "seeing", "seldom", "select", "seller", "senate", "sender", "senior", "sensor", "sequel", "series", "server", "settle", "severe", "sewage", "sexual", "shabby", "shadow", "shaken", "shelter", "sherif", "shield", "shinny", "ship", "shotgun", "shovel", "shower", "shrimp", "shrine", "shrink", "shuttle", "signal", "signed", "silent", "silicon", "silver", "simple", "simply", "singer", "single", "sister", "sitcom", "sketch", "skinny", "skull", "slack", "slam", "sleeve", "slight", "slim", "slogan", "slowly", "slum", "smooth", "snap", "sniper", "snow", "soak", "soccer", "social", "socket", "sodium", "sofa", "soften", "solely", "solve", "somber", "sooner", "sorrow", "source", "soviet", "spam", "span", "sphere", "spider", "spiral", "spirit", "spite", "sponge", "spouse", "spread", "spring", "sprint", "sprite", "spur", "square", "squash", "squat", "stable", "staff", "stale", "stall", "staple", "starch", "stare", "static", "statue", "status", "steady", "stereo", "still", "sting", "stir", "stomach", "strain", "strait", "strand", "stream", "street", "stress", "strict", "stride", "strike", "string", "strive", "stroke", "strong", "struck", "studio", "stumble", "stupid", "submit", "subtle", "suburb", "subway", "sudden", "suffer", "suitor", "summer", "summit", "summon", "sunset", "supply", "surely", "survey", "sustain", "swamp", "sweat", "symbol", "symptom", "syndic", "synergy", "synod", "syntax", "system", "tablet", "tackle", "tactic", "tailor", "talent", "talker", "target", "tariff", "tattoo", "tavern", "teller", "temper", "temple", "tenant", "tender", "tennis", "tenure", "terror", "thaw", "thence", "theory", "thesis", "thirst", "thirty", "though", "thread", "threat", "thrill", "thrive", "throat", "throne", "thrust", "ticket", "timber", "timely", "timing", "tiptoe", "tissue", "tobacco", "toilet", "tolled", "tomato", "tongue", "tonight", "torque", "tort", "toward", "tracer", "tragic", "trance", "travel", "tread", "treaty", "tribal", "tricky", "trifle", "triple", "troop", "trophy", "troupe", "truce", "tulip", "tumble", "tunnel", "turkey", "turtle", "twelve", "twenty", "tycoon", "tyrant", "ulcer", "unable", "unfair", "unify", "unique", "unless", "unlike", "unveil", "update", "uphold", "urgent", "useful", "utmost", "vacant", "vacuum", "vague", "valley", "vanish", "vanity", "varied", "vastly", "vector", "vegan", "velvet", "vendor", "venom", "verbal", "verdict", "verge", "verify", "versus", "vessel", "viable", "vicar", "victim", "viewer", "violet", "virtual", "virtue", "vision", "visual", "volley", "voyage", "waffle", "waiter", "wallet", "wander", "warden", "warm", "warrant", "warrior", "wealth", "weapon", "weekly", "weep", "weird", "welfare", "western", "when", "whisky", "wicked", "widely", "widen", "widow", "willing", "willow", "wimp", "window", "winner", "winter", "wisdom", "wizard", "wonder", "wooden", "worker", "worry", "worthy", "writer", "yearly", "yellow", "zenith", "zombie", "zonal"];
        const gameWords = allWordsList.filter(w => w.length >= WORD_LENGTH_MIN && w.length <= WORD_LENGTH_MAX);

        // --- Game State Variables ---
        let currentLevel;
        let score;
        let highscore = 0;
        let lives;
        let currentWPM;
        let gameActive;
        let animationFrameId;
        let gameMode = 'campaign';

        // Virtual coordinates space for physics calculations
        let virtualWidth = 800;
        let virtualHeight = 600;

        // Pipeline arrays for concurrent entities
        let fallingWords = [];
        let activeLasers = [];
        let activeParticles = [];

        // Multi-word progression counters
        let wordsSpawnedThisLevel = 0;
        let wordsResolvedThisLevel = 0;
        let spawnCooldownTimer = 0;

        // Target Lock variable holds reference to locked word object
        let lockedWord = null;

        // Screen shake & visual feedback state variables
        let screenShakeTime = 0;
        let screenShakeIntensity = 0;
        let flashAlpha = 0;

        // Overdrive / Time Dilation Meter state variables
        let energy = 0; // 0 to 100
        let slowMoActive = false;
        let slowMoTimeLeft = 0; // ms
        const SLOW_MO_DURATION = 5000;

        // Keyboard progression override callback
        let activeMessageCallback = null;

        // Rotating cannon object
        let cannon = {
            x: 0,
            y: 0,
            width: 50,
            height: CANNON_HEIGHT,
            angle: 0,
            targetAngle: 0
        };

        let lastFrameTime = 0;
        let audioInitialized = false;

        // --- Audio Setup (Tone.js) ---
        let laserSynth, missSynth, letterExplosionSynth, baseExplosionSynth, levelUpSynth, gameOverSynth;

        function initializeAudio() {
            if (audioInitialized) return;
            laserSynth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 },
                volume: -10
            }).toDestination();

            missSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 },
                volume: -15
            }).toDestination();

            letterExplosionSynth = new Tone.NoiseSynth({
                noise: { type: "pink" },
                envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.05 },
                volume: -12
            }).toDestination();

            baseExplosionSynth = new Tone.NoiseSynth({
                noise: { type: "brown" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 },
                volume: -5
            }).toDestination();

            levelUpSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.3, release: 0.5 },
                volume: -8
            }).toDestination();

            gameOverSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" },
                envelope: { attack: 0.1, decay: 0.5, sustain: 0, release: 0.5 },
                volume: -8
            }).toDestination();

            audioInitialized = true;
            console.log("Audio Initialized");
        }

        async function playSound(synth, noteOrDuration, time) {
            if (!audioInitialized) initializeAudio();
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            if (synth instanceof Tone.NoiseSynth) {
                synth.triggerAttackRelease(noteOrDuration, time);
            } else if (synth instanceof Tone.PolySynth) {
                synth.triggerAttackRelease(noteOrDuration, "8n", time);
            } else {
                synth.triggerAttackRelease(noteOrDuration, "8n", time);
            }
        }

        // --- Canvas Sizing with High-DPI Support ---
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            let canvasWidth, canvasHeight;
            if (containerWidth / containerHeight > 4 / 3) {
                canvasHeight = containerHeight;
                canvasWidth = canvasHeight * (4 / 3);
            } else {
                canvasWidth = containerWidth;
                canvasHeight = canvasWidth * (3 / 4);
            }

            virtualWidth = Math.max(320, canvasWidth);
            virtualHeight = Math.max(240, canvasHeight);

            const dpr = window.devicePixelRatio || 1;
            canvas.width = virtualWidth * dpr;
            canvas.height = virtualHeight * dpr;
            canvas.style.width = `${virtualWidth}px`;
            canvas.style.height = `${virtualHeight}px`;

            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            cannon.width = 50;
            cannon.height = CANNON_HEIGHT;
            cannon.x = virtualWidth / 2 - cannon.width / 2;
            cannon.y = virtualHeight - cannon.height - 5;

            fallingWords.forEach(word => calculateLetterPositions(word));

            if (gameActive || (!gameActive && currentLevel > 0)) {
                draw();
            }
        }

        // --- Game Initialization and Control ---
        function initGame() {
            currentLevel = 1;
            score = 0;
            lives = INITIAL_LIVES;
            gameActive = false;
            activeLasers = [];
            activeParticles = [];
            fallingWords = [];
            lockedWord = null;
            wordsSpawnedThisLevel = 0;
            wordsResolvedThisLevel = 0;
            spawnCooldownTimer = 0;
            screenShakeTime = 0;
            screenShakeIntensity = 0;
            flashAlpha = 0;
            energy = 0;
            slowMoActive = false;
            slowMoTimeLeft = 0;

            highscore = parseInt(localStorage.getItem('typing_laser_highscore')) || 0;
            updateScoreboard();

            document.fonts.ready.then(() => {
                resizeCanvas();
                showMenuMessage("Welcome to Typing Laser Attack!\nType the falling words.\n[SPACEBAR] triggers time-warp when full.", () => {
                    if (!audioInitialized) initializeAudio();
                    Tone.start();
                    startGame();
                });
            });
        }

        function startGame() {
            hideMessage();
            gameActive = true;
            startLevel();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            lastFrameTime = performance.now();
            gameLoop(lastFrameTime);
        }

        function startLevel() {
            currentWPM = BASE_WPM + (currentLevel - 1) * WPM_INCREMENT_PER_LEVEL;
            wordsSpawnedThisLevel = 0;
            wordsResolvedThisLevel = 0;
            spawnCooldownTimer = 0;
            fallingWords = [];
            lockedWord = null;
            updateScoreboard();
        }

        function levelComplete() {
            currentLevel++;
            if (currentLevel > MAX_LEVELS && gameMode === 'campaign') {
                gameWon();
            } else {
                playSound(levelUpSynth, ["C5", "E5", "G5", "C6"], Tone.now());
                showMessage(`Level ${currentLevel - 1} Complete!\n\nPress SPACE or ENTER to start Level ${currentLevel}`, null, () => {
                    hideMessage();
                    startLevel();
                });
            }
        }

        function gameOver() {
            gameActive = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            playSound(gameOverSynth, ["C3", "G2", "C2"], Tone.now());

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('typing_laser_highscore', highscore);
            }

            showMessage(`Game Over!\nFinal Score: ${score}\nLevel Reached: ${currentLevel}\n\nPress SPACE or ENTER to restart.`, null, initGame);
        }

        function gameWon() {
            gameActive = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            playSound(levelUpSynth, ["C4", "E4", "G4", "C5", "E5", "G5", "C6"], Tone.now());

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('typing_laser_highscore', highscore);
            }

            showMessage(`Congratulations! You beat all ${MAX_LEVELS} levels!\nFinal Score: ${score}\n\nPress SPACE or ENTER to play again.`, null, initGame);
        }

        // --- Word Mechanics ---
        function getRandomWord() {
            const randomIndex = Math.floor(Math.random() * gameWords.length);
            return gameWords[randomIndex];
        }

        function updateSpawning(deltaTime) {
            if (!gameActive) return;
            if (gameMode === 'campaign' && wordsSpawnedThisLevel >= WORDS_PER_LEVEL) return;

            spawnCooldownTimer -= deltaTime;

            // Fixed Bug: Force instant spawn if screen is empty and words remain [1]
            if (spawnCooldownTimer <= 0 || (fallingWords.length === 0 && (gameMode === 'endless' || wordsSpawnedThisLevel < WORDS_PER_LEVEL))) {
                spawnNextWord();
                wordsSpawnedThisLevel++;

                const baseCooldown = (60 / currentWPM) * 1000 * 0.45;
                spawnCooldownTimer = Math.max(800, baseCooldown + (Math.random() - 0.5) * 500);
            }
        }

        function spawnNextWord() {
            const text = getRandomWord();
            const currentFontSize = Math.min(30, Math.max(12, virtualWidth / 20));
            ctx.font = `${currentFontSize}px 'Press Start 2P'`;

            const fallDurationMs = (60 / currentWPM) * 1000;
            const absoluteSpeed = virtualHeight / fallDurationMs;
            const wordWidth = ctx.measureText(text).width;

            let wordType = 'normal';
            let hasShield = false;
            const roll = Math.random();
            if (roll < 0.12) {
                wordType = 'shielded';
                hasShield = true;
            } else if (roll < 0.20) { // Reverted Bomb spawn rate to original 8% [1]
                wordType = 'bomb';
            } else if (roll < 0.27) {
                wordType = 'healer';
            }

            const newWord = {
                text: text,
                x: Math.random() * Math.max(0, (virtualWidth - wordWidth)),
                y: -20,
                speed: absoluteSpeed * (0.8 + Math.random() * 0.4),
                typedIndex: 0,
                type: wordType,
                shieldActive: hasShield,
                letters: []
            };
            calculateLetterPositions(newWord);
            fallingWords.push(newWord);
        }

        function calculateLetterPositions(wordObj) {
            if (!wordObj) return;
            wordObj.letters = [];
            let currentX = wordObj.x;
            const currentFontSize = Math.min(30, Math.max(12, virtualWidth / 20));
            ctx.font = `${currentFontSize}px 'Press Start 2P'`;
            const charHeight = currentFontSize * 1.2;

            for (let i = 0; i < wordObj.text.length; i++) {
                const char = wordObj.text[i];
                const charWidth = ctx.measureText(char).width;
                wordObj.letters.push({
                    char: char,
                    x: currentX + charWidth / 2,
                    y: wordObj.y + charHeight / 2,
                    width: charWidth,
                    hit: false
                });
                currentX += charWidth;
            }
        }

        function updateFallingWords(deltaTime) {
            const currentFontSize = Math.min(30, Math.max(12, virtualWidth / 20));
            const charHeight = currentFontSize * 1.2;

            const speedModifier = slowMoActive ? 0.25 : 1.0;

            for (let i = fallingWords.length - 1; i >= 0; i--) {
                const word = fallingWords[i];
                word.y += word.speed * speedModifier * deltaTime;

                word.letters.forEach(letter => {
                    letter.y = word.y + charHeight / 2;
                });

                if (word.y + charHeight > virtualHeight - CANNON_HEIGHT - 5) {
                    lives--;
                    score -= 10;
                    if (score < 0) score = 0;
                    updateScoreboard();

                    triggerScreenShake(250, 15);
                    flashAlpha = 0.5;

                    createExplosion(word.x + ctx.measureText(word.text).width / 2, virtualHeight - CANNON_HEIGHT, '#f00', 45);
                    playSound(baseExplosionSynth, "0.3s", Tone.now());

                    if (lockedWord === word) {
                        lockedWord = null;
                    }

                    fallingWords.splice(i, 1);
                    wordsResolvedThisLevel++;

                    if (lives <= 0) {
                        gameOver();
                        return;
                    } else if (wordsResolvedThisLevel >= WORDS_PER_LEVEL) {
                        if (gameMode === 'campaign') {
                            levelComplete();
                            return;
                        } else {
                            wordsResolvedThisLevel = 0;
                            currentLevel++;
                            currentWPM = BASE_WPM + (currentLevel - 1) * WPM_INCREMENT_PER_LEVEL;
                            updateScoreboard();
                            playSound(levelUpSynth, ["C4", "E4", "G4"], Tone.now());
                        }
                    }
                }
            }
        }

        // --- Input Handling & Target Locking ---
        function handleKeyPress(event) {
            if (messageBox.style.display === 'block') {
                if (event.key === 'Enter' || event.key === ' ' || event.code === 'Space') {
                    event.preventDefault();
                    if (activeMessageCallback) {
                        const cb = activeMessageCallback;
                        activeMessageCallback = null;
                        cb();
                    }
                    return;
                }
            }

            if (event.key === " " || event.code === "Space") {
                event.preventDefault();
                if (gameActive) {
                    triggerSlowMotion();
                }
                return;
            }

            if (!gameActive || fallingWords.length === 0) return;
            if (!audioInitialized) {
                initializeAudio();
                Tone.start();
            }

            const typedChar = event.key.toLowerCase();
            if (typedChar.length !== 1 || !(/[a-z]/.test(typedChar))) return;

            if (lockedWord === null) {
                let candidates = [];
                fallingWords.forEach(word => {
                    if (word.text[0].toLowerCase() === typedChar) {
                        candidates.push(word);
                    }
                });

                if (candidates.length > 0) {
                    candidates.sort((a, b) => b.y - a.y);
                    lockedWord = candidates[0];
                }
            }

            if (lockedWord !== null) {
                const expectedChar = lockedWord.text[lockedWord.typedIndex].toLowerCase();
                const targetLetter = lockedWord.letters[lockedWord.typedIndex];

                const dx = targetLetter.x - (cannon.x + cannon.width / 2);
                const dy = targetLetter.y - cannon.y;
                cannon.targetAngle = Math.atan2(dy, dx) + Math.PI / 2;

                if (typedChar === expectedChar) {
                    lockedWord.letters[lockedWord.typedIndex].hit = true;
                    lockedWord.typedIndex++;
                    score += 10;

                    energy = Math.min(100, energy + 1.5);
                    updateScoreboard();

                    let laserColor = '#0f0';
                    if (lockedWord.type === 'shielded' && lockedWord.shieldActive) laserColor = '#0cf';
                    else if (lockedWord.type === 'bomb') laserColor = '#f90';
                    else if (lockedWord.type === 'healer') laserColor = '#5f5';

                    createLaser(targetLetter.x, targetLetter.y, true, laserColor);
                    createExplosion(targetLetter.x, targetLetter.y, laserColor, 15);
                    playSound(laserSynth, "C5", Tone.now());
                    playSound(letterExplosionSynth, "0.05s", Tone.now() + 0.01);

                    if (lockedWord.typedIndex === lockedWord.text.length) {

                        if (lockedWord.type === 'shielded' && lockedWord.shieldActive) {
                            lockedWord.shieldActive = false;
                            lockedWord.typedIndex = 0;
                            lockedWord.letters.forEach(letter => letter.hit = false);

                            createExplosion(lockedWord.x + ctx.measureText(lockedWord.text).width / 2, lockedWord.y + charHeight / 2, '#0cf', 35);
                            triggerScreenShake(150, 6);
                            playSound(levelUpSynth, ["G4", "C5"], Tone.now());
                            return;
                        }

                        if (lockedWord.type === 'healer') {
                            lives = Math.min(5, lives + 1);
                            createExplosion(lockedWord.x + ctx.measureText(lockedWord.text).width / 2, lockedWord.y, '#0f0', 30);
                            playSound(levelUpSynth, ["C5", "E5", "G5"], Tone.now());
                        }

                        if (lockedWord.type === 'bomb') {
                            playSound(baseExplosionSynth, "0.5s", Tone.now());
                            triggerScreenShake(600, 25);

                            // Fixed Bug: Count the typed bomb itself as resolved [1]
                            wordsResolvedThisLevel++;

                            // Detonate all other words currently on screen
                            for (let i = fallingWords.length - 1; i >= 0; i--) {
                                const victim = fallingWords[i];
                                if (victim !== lockedWord) {
                                    score += victim.text.length * 5;
                                    createExplosion(victim.x + ctx.measureText(victim.text).width / 2, victim.y, '#f40', 30);
                                    wordsResolvedThisLevel++;
                                }
                            }
                            fallingWords = [];
                            lockedWord = null;
                            updateScoreboard();

                            if (wordsResolvedThisLevel >= WORDS_PER_LEVEL) {
                                if (gameMode === 'campaign') {
                                    levelComplete();
                                } else {
                                    wordsResolvedThisLevel = 0;
                                    currentLevel++;
                                    currentWPM = BASE_WPM + (currentLevel - 1) * WPM_INCREMENT_PER_LEVEL;
                                    updateScoreboard();
                                    playSound(levelUpSynth, ["C4", "E4", "G4"], Tone.now());
                                }
                            }
                            return;
                        }

                        score += lockedWord.text.length * 5;

                        const idx = fallingWords.indexOf(lockedWord);
                        if (idx !== -1) {
                            fallingWords.splice(idx, 1);
                        }

                        lockedWord = null;
                        wordsResolvedThisLevel++;
                        updateScoreboard();

                        if (wordsResolvedThisLevel >= WORDS_PER_LEVEL) {
                            if (gameMode === 'campaign') {
                                levelComplete();
                            } else {
                                wordsResolvedThisLevel = 0;
                                currentLevel++;
                                currentWPM = BASE_WPM + (currentLevel - 1) * WPM_INCREMENT_PER_LEVEL;
                                updateScoreboard();
                                playSound(levelUpSynth, ["C4", "E4", "G4"], Tone.now());
                            }
                        }
                    }
                } else {
                    score -= 5;
                    energy = Math.max(0, energy - 10);
                    if (score < 0) score = 0;
                    updateScoreboard();

                    cannon.targetAngle += (Math.random() - 0.5) * 0.5;
                    createLaser(targetLetter.x + (Math.random() - 0.5) * 60, targetLetter.y - 50, false, '#f00');
                    playSound(missSynth, "A2", Tone.now());
                }
            } else {
                score -= 5;
                energy = Math.max(0, energy - 10);
                if (score < 0) score = 0;
                updateScoreboard();
                playSound(missSynth, "A2", Tone.now());
            }
        }

        // --- Slow-Motion Control ---
        function triggerSlowMotion() {
            if (!gameActive || energy < 100 || slowMoActive) return;
            slowMoActive = true;
            slowMoTimeLeft = SLOW_MO_DURATION;
            playSound(levelUpSynth, ["C3", "G3", "C4", "E4"], Tone.now());
        }

        function updateSlowMo(deltaTime) {
            if (!slowMoActive) return;
            slowMoTimeLeft -= deltaTime;
            energy = Math.max(0, (slowMoTimeLeft / SLOW_MO_DURATION) * 100);

            if (slowMoTimeLeft <= 0) {
                slowMoActive = false;
                energy = 0;
                playSound(gameOverSynth, ["C4", "G3", "C3"], Tone.now());
            }
        }

        // --- Screen Shake & Feedback ---
        function triggerScreenShake(time, intensity) {
            screenShakeTime = time;
            screenShakeIntensity = intensity;
        }

        // --- Visual Effects System ---
        function createLaser(targetX, targetY, hit, color = '#0f0') {
            activeLasers.push({
                x1: cannon.x + cannon.width / 2,
                y1: cannon.y,
                x2: targetX,
                y2: targetY,
                color: color,
                maxLife: 200,
                lifeLeft: 200
            });
        }

        function updateLasers(deltaTime) {
            activeLasers = activeLasers.filter(laser => {
                laser.lifeLeft -= deltaTime;
                return laser.lifeLeft > 0;
            });
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1.5;
                activeParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    size: Math.random() * 3 + 2,
                    maxLife: 400 + Math.random() * 200,
                    lifeLeft: 400 + Math.random() * 200
                });
            }
        }

        function updateParticles(deltaTime) {
            activeParticles = activeParticles.filter(p => {
                p.lifeLeft -= deltaTime;
                p.x += p.vx * (deltaTime / 16.67);
                p.y += p.vy * (deltaTime / 16.67);
                return p.lifeLeft > 0;
            });
        }

        function updateCannon(deltaTime) {
            const angleDiff = cannon.targetAngle - cannon.angle;
            cannon.angle += angleDiff * 0.2 * (deltaTime / 16.67);
        }

        const charHeight = Math.min(30, Math.max(12, virtualWidth / 20)) * 1.2;

        // --- Drawing Operations ---
        function draw() {
            ctx.clearRect(0, 0, virtualWidth, virtualHeight);

            ctx.save();
            let shakeX = 0;
            let shakeY = 0;
            if (screenShakeTime > 0) {
                shakeX = (Math.random() - 0.5) * screenShakeIntensity;
                shakeY = (Math.random() - 0.5) * screenShakeIntensity;
            }
            ctx.translate(shakeX, shakeY);

            // Draw base
            ctx.fillStyle = '#0f0';
            ctx.fillRect(cannon.x, cannon.y + 10, cannon.width, cannon.height - 10);

            // Draw rotating turret barrel
            ctx.save();
            ctx.translate(cannon.x + cannon.width / 2, cannon.y + 10);
            ctx.rotate(cannon.angle);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(-6, -20, 12, 20);
            ctx.restore();

            // Draw falling words
            fallingWords.forEach(word => {
                const currentFontSize = Math.min(30, Math.max(12, virtualWidth / 20));
                ctx.font = `${currentFontSize}px 'Press Start 2P'`;
                ctx.textBaseline = 'middle';

                if (lockedWord && word !== lockedWord) {
                    ctx.fillStyle = '#333';
                } else {
                    if (word.type === 'shielded' && word.shieldActive) {
                        ctx.fillStyle = '#0cf';
                    } else if (word.type === 'bomb') {
                        ctx.fillStyle = '#f90';
                    } else if (word.type === 'healer') {
                        ctx.fillStyle = '#5f5';
                    } else {
                        ctx.fillStyle = lockedWord ? '#fff' : '#aaa';
                    }
                }

                for (let i = 0; i < word.text.length; i++) {
                    const letterObj = word.letters[i];
                    if (!letterObj.hit) {
                        ctx.fillText(letterObj.char, letterObj.x - letterObj.width / 2, word.y + (currentFontSize * 1.2) / 2);
                    }
                }

                if (word.type === 'shielded' && word.shieldActive) {
                    const wordWidth = ctx.measureText(word.text).width;
                    const charHeight = currentFontSize * 1.2;
                    ctx.save();
                    ctx.beginPath();

                    const centerX = word.x + wordWidth / 2;
                    const centerY = word.y + charHeight / 2;
                    const radius = (wordWidth / 2) + 12;

                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#0cf';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);

                    ctx.shadowColor = '#0cf';
                    ctx.shadowBlur = 8 + Math.sin(performance.now() / 100) * 4;

                    ctx.stroke();
                    ctx.restore();
                }

                if (lockedWord && word === lockedWord) {
                    const wordWidth = ctx.measureText(word.text).width;
                    const charHeight = currentFontSize * 1.2;

                    ctx.save();

                    let bracketColor = '#0ff';
                    if (word.type === 'shielded' && word.shieldActive) bracketColor = '#0cf';
                    else if (word.type === 'bomb') bracketColor = '#f90';
                    else if (word.type === 'healer') bracketColor = '#5f5';

                    ctx.strokeStyle = bracketColor;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = bracketColor;
                    ctx.shadowBlur = 6;

                    const padX = 8;
                    const padY = 4;
                    const left = word.x - padX;
                    const right = word.x + wordWidth + padX;
                    const top = word.y - padY;
                    const bottom = word.y + charHeight + padY;

                    const len = 8;

                    ctx.beginPath();
                    ctx.moveTo(left + len, top); ctx.lineTo(left, top); ctx.lineTo(left, top + len);
                    ctx.moveTo(right - len, top); ctx.lineTo(right, top); ctx.lineTo(right, top + len);
                    ctx.moveTo(left + len, bottom); ctx.lineTo(left, bottom); ctx.lineTo(left, bottom - len);
                    ctx.moveTo(right - len, bottom); ctx.lineTo(right, bottom); ctx.lineTo(right, bottom - len);

                    ctx.stroke();
                    ctx.restore();
                }
            });

            // Draw glowing fading lasers
            activeLasers.forEach(laser => {
                const alpha = laser.lifeLeft / laser.maxLife;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(laser.x1, laser.y1);
                ctx.lineTo(laser.x2, laser.y2);

                ctx.strokeStyle = laser.color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 3;

                ctx.shadowColor = laser.color;
                ctx.shadowBlur = 10;

                ctx.stroke();
                ctx.restore();
            });

            // Draw visual scattering explosion particles
            activeParticles.forEach(p => {
                const alpha = p.lifeLeft / p.maxLife;
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                ctx.restore();
            });

            // Draw Canvas Power / Energy Meter
            const barW = 140;
            const barH = 10;
            const barX = virtualWidth - barW - 15;
            const barY = 15;

            ctx.save();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, barH);

            ctx.fillStyle = slowMoActive ? '#f0f' : (energy >= 100 ? '#0ff' : '#ff0');
            ctx.fillRect(barX + 2, barY + 2, Math.max(0, (barW - 4) * (energy / 100)), barH - 4);

            ctx.font = "8px 'Press Start 2P'";
            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'middle';
            ctx.fillText("POWER", barX - 60, barY + barH / 2);

            if (energy >= 100 && !slowMoActive) {
                if (Math.floor(performance.now() / 250) % 2 === 0) {
                    ctx.fillStyle = '#0ff';
                    ctx.fillText("[PRESS SPACE]", barX - 180, barY + barH / 2);
                }
            }
            ctx.restore();

            // Draw visual damage flash overlay
            if (flashAlpha > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
                ctx.fillRect(0, 0, virtualWidth, virtualHeight);
                ctx.restore();
            }

            if (slowMoActive) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 255, 255, 0.05)';
                ctx.fillRect(0, 0, virtualWidth, virtualHeight);

                ctx.strokeStyle = 'rgba(0, 255, 255, 0.12)';
                ctx.lineWidth = 1;
                for (let y = 0; y < virtualHeight; y += 4) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(virtualWidth, y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.restore();
        }

        // --- UI Updates ---
        function updateScoreboard() {
            levelDisplay.textContent = `Level: ${currentLevel}`;
            scoreDisplay.textContent = `Score: ${score}`;
            highscoreDisplay.textContent = `HI-SCORE: ${highscore}`;
            livesDisplay.textContent = `Lives: ${lives}`;
            wpmDisplay.textContent = `WPM: ${currentWPM || BASE_WPM}`;
        }

        function showMenuMessage(text, startCallback) {
            messageText.innerHTML = text.replace(/\n/g, '<br>');
            messageButton.textContent = "Campaign Mode";
            messageButton.style.display = 'inline-block';
            messageButtonEndless.textContent = "Endless Mode";
            messageButtonEndless.style.display = "inline-block";

            const registerMode = async (mode) => {
                gameMode = mode;
                activeMessageCallback = null;
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                startCallback();
            };

            messageButton.onclick = () => registerMode('campaign');
            messageButtonEndless.onclick = () => registerMode('endless');

            activeMessageCallback = () => registerMode('campaign');

            messageBox.style.display = 'block';
        }

        function showMessage(text, buttonText, callback, autoHideDelay = 0) {
            messageText.innerHTML = text.replace(/\n/g, '<br>');
            activeMessageCallback = callback;

            if (buttonText) {
                messageButton.style.display = 'inline-block';
                messageButton.textContent = buttonText;
            } else {
                messageButton.style.display = 'none';
            }
            messageButtonEndless.style.display = "none";

            const wrappedCallback = async () => {
                activeMessageCallback = null;
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                callback();
            };
            messageButton.onclick = wrappedCallback;
            messageBox.style.display = 'block';

            if (autoHideDelay > 0) {
                setTimeout(() => {
                    if (messageBox.style.display === 'block' && messageButton.onclick === wrappedCallback) {
                        wrappedCallback();
                    }
                }, autoHideDelay);
            }
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (!gameActive && currentLevel > 0) {
                draw();
                if (activeParticles.length > 0 || activeLasers.length > 0) {
                    const fakeDelta = 16.67;
                    updateParticles(fakeDelta);
                    updateLasers(fakeDelta);
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
                return;
            }
            if (!gameActive) return;

            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            const cappedDeltaTime = Math.min(deltaTime, 100);

            if (screenShakeTime > 0) {
                screenShakeTime -= cappedDeltaTime;
            }
            if (flashAlpha > 0) {
                flashAlpha = Math.max(0, flashAlpha - (cappedDeltaTime / 500));
            }

            updateSlowMo(cappedDeltaTime);
            updateSpawning(cappedDeltaTime);
            updateFallingWords(cappedDeltaTime);
            updateCannon(cappedDeltaTime);
            updateLasers(cappedDeltaTime);
            updateParticles(cappedDeltaTime);
            draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', handleKeyPress);
        window.addEventListener('resize', resizeCanvas);

        // --- Start ---
        initGame(); 
    </script>
